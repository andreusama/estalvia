{% load i18n %}
{# Hoja inferior vacía: app.js la rellena con la plantilla del grupo que se toca. Ejemplo: las acciones no se guardan. #}
<dialog class="hoja" id="hoja" aria-labelledby="hoja-titulo">
  <div class="hoja__asa" data-asa aria-hidden="true"></div>
  <div class="hoja__cuerpo" id="hoja-cuerpo" tabindex="-1" autofocus></div>
  <div class="hoja__pie" id="hoja-pie">
    <button class="btn btn--primary btn--block" type="button" data-accion="revisado">{% translate "Marcar como revisado" %}</button>
    <button class="btn btn--secondary btn--block" type="button" data-accion="reclamar">{% translate "Reclamar al proveedor" %}</button>
  </div>
</dialog>
{% for g in grupos %}<template id="d-{{ g.id }}">{% include "bar/_grupo_detalle.html" with g=g en_hoja=True %}</template>{% endfor %}
