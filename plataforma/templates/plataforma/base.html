{% load static i18n %}{% get_current_language as LANGUAGE_CODE %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Estalvia{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{% static 'plataforma/css/tokens.css' %}">
<link rel="stylesheet" href="{% static 'plataforma/css/components.css' %}">
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% block shell %}<main class="page">
  {% if request.user.is_authenticated %}
  <nav class="topbar" aria-label="{% translate 'Navegación' %}">
    <a class="brand" href="{% url 'portada' %}">Estalvia</a>
    <form method="post" action="{% url 'salir' %}">{% csrf_token %}<button class="btn btn--secondary" type="submit">{% translate "Salir" %}</button></form>
  </nav>
  {% endif %}
  {% block content %}{% endblock %}
</main>{% endblock %}
</body>
</html>
