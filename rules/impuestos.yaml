# Impuestos. Escrito a mano desde el texto del BOE (no hay tabla que parsear). Ámbito: península.
rules:
  # --- IVA: tipo general. La rebaja del RDL 7/2026 al 10 % solo cubre contratos con potencia <= 10 kW,
  #     así que no aplica a 3.0TD/6.1TD (potencia > 15 kW).
  - id: IVA-GENERAL-2025
    kind: iva_pct
    value: "21"
    unit: "%"
    valid_from: 2025-01-01
    source: "Ley 37/1992 del IVA, art. 90.Uno (tipo general). RDL 7/2026 (BOE-A-2026-6544) limita la rebaja temporal al 10 % a contratos con término fijo de potencia <= 10 kW; no aplica a >15 kW."
  # --- Impuesto especial sobre la electricidad
  - id: IEE-GENERAL-2025
    kind: ie_pct
    value: "5.11269632"
    unit: "%"
    valid_from: 2025-01-01
    valid_to: 2026-03-21
    source: "Ley 38/1992 de Impuestos Especiales, art. 99 (tipo 5,11269632 %, confirmado en el preámbulo del RDL 7/2026, BOE-A-2026-6544)."
  - id: IEE-REDUCIDO-2026
    kind: ie_pct
    value: "0.5"
    unit: "%"
    valid_from: 2026-03-22
    valid_to: 2026-05-31
    source: "RDL 7/2026, art. 40 (BOE-A-2026-6544): 0,5 % desde su entrada en vigor (22/03/2026) hasta el 30/06/2026. La AEAT confirmó la desactivación desde el 01/06/2026 (cláusula del IPC de electricidad)."
  - id: IEE-GENERAL-2026-06
    kind: ie_pct
    value: "5.11269632"
    unit: "%"
    valid_from: 2026-06-01
    source: "Ley 38/1992, art. 99; desactivación de la rebaja según nota de la AEAT de 19/05/2026. VERIFICAR agosto y septiembre 2026: arts. 12 y 13 del RDL 18/2026 (BOE-A-2026-14112) devuelven el 0,5 % si el IPC de electricidad de junio/julio supera en más de un 15 % el del año anterior."
  - id: IEE-MIN-PROFESIONAL
    kind: ie_min_eur_mwh
    period: profesional
    value: "0.5"
    unit: "EUR/MWh"
    valid_from: 2025-01-01
    source: "Nivel mínimo de imposición para electricidad con fines profesionales, Directiva 2003/96/CE; recogido en el preámbulo del RDL 7/2026 y RDL 18/2026. VERIFICAR art. 99.2 de la Ley 38/1992 (en la ley figura como uso industrial)."
  - id: IEE-MIN-OTROS
    kind: ie_min_eur_mwh
    period: otros
    value: "1"
    unit: "EUR/MWh"
    valid_from: 2025-01-01
    source: "Nivel mínimo de imposición para el resto de usos, Directiva 2003/96/CE; preámbulo del RDL 7/2026."
verificar:
  - "Devengo del IEE: no está confirmado si el tipo depende de la fecha de consumo o de la de facturación/exigibilidad. El motor usa el fin del periodo facturado."
  - "Agosto y septiembre de 2026: el RDL 18/2026 puede haber reactivado el 0,5 % (IEE) según el IPC de junio/julio. No hay dato verificado; la regla las trata con el tipo general."
  - "IVA: si el cliente es sujeto pasivo con derecho a deducción, el IVA no es coste real; el informe debe mostrarlo aparte."
  - "Otros: Impuesto del valor de la producción de energía y cuotas de bono social no se repercuten en esta factura; confirmar con facturas reales."
