# Periodos horarios 2.0TD, Península. Fuente: Circular 3/2020 CNMC (BOE-A-2020-1066), art. 7.3 y 7.4.
# Escrito a mano desde el texto del BOE. Hora = hora de inicio (h) del tramo [h, h+1).
fuente: "Circular 3/2020 CNMC, BOE-A-2020-1066, art. 7.3 (tres periodos de energía) y 7.4 (dos de potencia)"
aplica_a: [2.0TD]
# Laborables (lunes a viernes no festivos nacionales)
energia_laborable:
  P1: [[10, 14], [18, 22]]
  P2: [[8, 10], [14, 18], [22, 24]]
  P3: [[0, 8]]
# Sábados, domingos, festivos nacionales y 6 de enero: todo el día P3 (valle)
energia_festivo:
  P3: [[0, 24]]
# Potencia: punta agrupa P1 y P2 de energía (en la tabla de potencia: P1); valle es P3 (P2 de potencia)
potencia_equivale:
  P1: [P1, P2]
  P2: [P3]
