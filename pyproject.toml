[project]
name = "estalvia"
version = "0.1.0"
description = "Estalvia: plataforma de prototipos de IA para pymes (primer módulo: albaranes y facturas de un bar)"
requires-python = ">=3.10"
dependencies = ["anthropic==2.3.0", "Django==5.2.18"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plataforma*", "prototipos*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["plataforma", "prototipos"]

[tool.ruff]
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E741", "E731", "B008", "B905"]
