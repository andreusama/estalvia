[project]
name = "estalvia"
version = "0.1.0"
description = "Copiloto energético para pymes agroalimentarias (MVP)"
# TDD pide Python 3.12+ (VERIFICAR al iniciar). El código es compatible con 3.10 para el entorno local actual.
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml", "anthropic==2.3.0", "Django==5.2.18"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"estalvia.web" = ["templates/**/*", "static/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E741", "E731", "B008", "B905"]
